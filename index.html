<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>True or False 💘</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gap: 14px;
      --tile: min(calc((100vw - 420px - 80px - var(--gap)) / 2), 57vh);
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #fbc2eb, #a18cd1);
      background-size: 400% 400%;
      animation: bgMove 12s ease infinite;
      font-family: "Poppins", sans-serif;
      overflow: hidden;
      transition: padding-left 0.7s ease;
    }

    @keyframes bgMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ---------- Screens (each one is a card) ---------- */
    .card {
      display: none;
      width: min(92%, 420px);
      padding: 40px 30px 45px;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(18px);
      border-radius: 28px;
      text-align: center;
      box-shadow: 0 30px 80px rgba(0,0,0,0.25), inset 0 0 0 1px rgba(255,255,255,0.4);
      position: relative;
    }

    .card.active {
      display: block;
      animation: cardIn 0.9s ease;
    }

    .card.swap { animation: cardSwap 0.45s ease; }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes cardSwap {
      from { opacity: 0; transform: translateX(40px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .card::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: 30px;
      background: linear-gradient(120deg, #ff4d6d, #ff9a9e, #fbc2eb);
      z-index: -1;
      filter: blur(20px);
      opacity: 0.7;
    }

    .emoji {
      font-size: 68px;
      margin-bottom: 12px;
      animation: heartbeat 1.8s infinite;
    }

    @keyframes heartbeat {
      0%,100% { transform: scale(1); }
      25% { transform: scale(1.08); }
      50% { transform: scale(1); }
      75% { transform: scale(1.12); }
    }

    h1, h2 {
      font-family: "Playfair Display", serif;
      color: #4a1c2f;
      line-height: 1.25;
    }

    h1 { font-size: 44px; margin-bottom: 8px; }
    h2 { font-size: 28px; margin-bottom: 30px; line-height: 1.35; }

    .subtitle {
      font-size: 14px;
      color: #6b6b6b;
      font-style: italic;
      margin-bottom: 30px;
    }

    /* ---------- Buttons ---------- */
    .btn {
      padding: 14px 36px;
      border-radius: 40px;
      border: none;
      font-family: inherit;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    .btn:active { transform: scale(0.94); }

    .btn-main {
      background: linear-gradient(135deg, #ff4d6d, #ff758f);
      color: #fff;
      box-shadow: 0 15px 35px rgba(255,77,109,0.55);
    }

    .btn-main:hover {
      transform: translateY(-3px);
      box-shadow: 0 20px 40px rgba(255,77,109,0.7);
    }

    .btn-false {
      background: rgba(255,255,255,0.9);
      color: #777;
    }

    /* Once it starts running, the False button roams the whole screen */
    .btn-false.flying {
      position: fixed;
      z-index: 50;
      transition: left 0.35s cubic-bezier(.3,1.4,.5,1), top 0.35s cubic-bezier(.3,1.4,.5,1), transform 0.25s ease;
    }

    .buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 22px;
      height: 56px;
    }

    /* ---------- Question screen ---------- */
    .progress {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255,77,109,0.22);
      transition: background 0.3s ease, transform 0.3s ease;
    }

    .dot.done { background: #ff4d6d; }
    .dot.current { background: #ff4d6d; transform: scale(1.35); }

    .count {
      font-size: 13px;
      color: #6b6b6b;
      margin-bottom: 6px;
      letter-spacing: 0.04em;
    }

    .question {
      font-family: "Playfair Display", serif;
      font-size: 30px;
      color: #4a1c2f;
      line-height: 1.3;
      margin: 14px 0 34px;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ---------- Finale: video + photo ---------- */
    #gallery {
      position: fixed;
      left: 24px;
      top: 50%;
      display: flex;
      gap: var(--gap);
      align-items: center;
      z-index: 5;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-50%) scale(0.85);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    #gallery.show { opacity: 1; transform: translateY(-50%) scale(1); }

    #gallery video, #gallery img {
      display: block;
      width: var(--tile);
      height: auto;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }

    @media (min-width: 900px) {
      body.revealed { padding-left: calc(var(--tile) * 2 + var(--gap) + 48px); }
    }

    @media (max-width: 899px) {
      :root { --tile: min(40vw, 21vh); }
      #gallery { left: 50%; top: 16px; transform: translate(-50%, 0) scale(0.85); }
      #gallery.show { transform: translate(-50%, 0) scale(1); }
    }

    /* ---------- Floating hearts ---------- */
    .heart {
      position: absolute;
      bottom: -20px;
      animation: floatUp linear forwards;
      pointer-events: none;
      filter: blur(0.3px);
    }

    @keyframes floatUp {
      from { transform: translateY(0) scale(1); opacity: 1; }
      to { transform: translateY(-120vh) scale(1.8); opacity: 0; }
    }

    @media (max-width: 480px) {
      h1 { font-size: 36px; }
      h2 { font-size: 23px; }
      .emoji { font-size: 58px; }
      .btn { padding: 12px 28px; font-size: 15px; }
      .question { font-size: 25px; min-height: 105px; }
    }
  </style>
</head>

<body>

  <!-- Screen 1: landing -->
  <section class="card active" id="screenStart">
    <div class="emoji">🌻✨❤️</div>
    <h1>True or False</h1>
    <p class="subtitle">a few questions, for you</p>
    <div class="buttons">
      <button class="btn btn-main" id="startBtn" type="button">Start 💖</button>
    </div>
  </section>

  <!-- Screen 2: questions (one card, reused for every question) -->
  <section class="card" id="screenQuiz">
    <div class="progress" id="progress"></div>
    <div class="count" id="count"></div>
    <div class="question" id="question">?</div>

    <div class="buttons" id="answerButtons">
      <button class="btn btn-main" id="trueBtn" type="button">True 💖</button>
      <button class="btn btn-false" id="falseBtn" type="button" tabindex="-1">False 🙈</button>
    </div>
  </section>

  <!-- Screen 3: finale -->
  <section class="card" id="screenEnd">
    <div class="emoji">💕🌻💕</div>
    <h2 style="margin-bottom:0">CORRECTTTT 💕<br>I love you my honeybun :)</h2>
  </section>

  <script>
    // ====== EDIT YOUR QUESTIONS HERE ======
    const QUESTIONS = [
      "You are the most beautiful girl in the world",
      "I am beyond lucky to have you",
      "In a room full of people, I would choose you",
      "You are doing so well and should be so proud",
      "I love you"
    ];
    // ======================================

    const $ = (id) => document.getElementById(id);
    const screens = { start: $("screenStart"), quiz: $("screenQuiz"), end: $("screenEnd") };
    const falseBtn = $("falseBtn");
    const trueBtn = $("trueBtn");
    const answerButtons = $("answerButtons");

    let current = 0;
    let quizActive = false;

    function show(name) {
      for (const key in screens) {
        screens[key].classList.remove("active", "swap");
      }
      screens[name].classList.add("active");
    }

    // ---------- Question rendering ----------
    function renderQuestion() {
      $("question").textContent = QUESTIONS[current];
      $("count").textContent = "Question " + (current + 1) + " of " + QUESTIONS.length;
      $("progress").innerHTML = QUESTIONS.map((_, i) =>
        '<span class="dot ' + (i < current ? "done" : i === current ? "current" : "") + '"></span>'
      ).join("");

      resetFalseButton();
    }

    // ---------- Start ----------
    $("startBtn").addEventListener("click", () => {
      current = 0;
      quizActive = true;
      renderQuestion();
      show("quiz");
    });

    // ---------- True: next question ----------
    trueBtn.addEventListener("click", () => {
      miniConfetti();
      current++;

      if (current >= QUESTIONS.length) {
        finish();
        return;
      }

      renderQuestion();
      // replay the slide-in animation
      screens.quiz.classList.remove("swap");
      void screens.quiz.offsetWidth;
      screens.quiz.classList.add("swap");
    });

    function finish() {
      quizActive = false;
      resetFalseButton();
      show("end");
      $("gallery").classList.add("show");
      document.body.classList.add("revealed");
      $("endVideo").play().catch(() => {});

      try {
        if (typeof confetti === "function") {
          confetti({ particleCount: 260, spread: 120, origin: { y: 0.65 } });
        }
      } catch (err) { console.error("Confetti failed:", err); }
    }

    function miniConfetti() {
      try {
        if (typeof confetti === "function") {
          confetti({ particleCount: 50, spread: 70, origin: { y: 0.7 } });
        }
      } catch (err) { console.error("Confetti failed:", err); }
    }

    // ---------- False: runs away around the whole screen, can't be clicked ----------
    let target = null;      // where the button is heading (viewport coords)
    let lastDodge = 0;

    function resetFalseButton() {
      falseBtn.classList.remove("flying");
      falseBtn.style.left = "";
      falseBtn.style.top = "";
      if (falseBtn.parentElement !== answerButtons) answerButtons.appendChild(falseBtn);
      target = null;
    }

    function rectsOverlap(a, b, pad) {
      return !(a.right + pad < b.left || a.left - pad > b.right ||
               a.bottom + pad < b.top || a.top - pad > b.bottom);
    }

    function dodge(px, py) {
      const now = Date.now();
      if (now - lastDodge < 120) return;
      lastDodge = now;

      const margin = 12;

      if (!falseBtn.classList.contains("flying")) {
        const r = falseBtn.getBoundingClientRect();
        // The card uses backdrop-filter, which would trap position:fixed inside it,
        // so move the button out to <body> before letting it roam.
        document.body.appendChild(falseBtn);
        falseBtn.classList.add("flying");
        falseBtn.style.left = r.left + "px";
        falseBtn.style.top = r.top + "px";
        void falseBtn.offsetWidth;
        target = { x: r.left, y: r.top };
      }

      const w = falseBtn.offsetWidth;
      const h = falseBtn.offsetHeight;
      const maxX = window.innerWidth - w - margin;
      const maxY = window.innerHeight - h - margin;
      const trueRect = trueBtn.getBoundingClientRect();

      let best = null;
      for (let i = 0; i < 40; i++) {
        const x = margin + Math.random() * Math.max(0, maxX - margin);
        const y = margin + Math.random() * Math.max(0, maxY - margin);
        const box = { left: x, top: y, right: x + w, bottom: y + h };

        const cx = x + w / 2, cy = y + h / 2;
        const farFromPointer = px == null || Math.hypot(cx - px, cy - py) > 220;
        const farFromOld = !target || Math.hypot(x - target.x, y - target.y) > 180;
        const clearOfTrue = !rectsOverlap(box, trueRect, 16);

        if (farFromPointer && farFromOld && clearOfTrue) { best = { x, y }; break; }
        if (!best) best = { x, y };
      }

      target = best;
      falseBtn.style.left = best.x + "px";
      falseBtn.style.top = best.y + "px";
    }

    // Hover (desktop)
    falseBtn.addEventListener("mouseenter", (e) => dodge(e.clientX, e.clientY));
    // Touch (phones)
    falseBtn.addEventListener("touchstart", (e) => { e.preventDefault(); dodge(); }, { passive: false });
    falseBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); dodge(e.clientX, e.clientY); });
    // Safety net: if a click or keypress ever reaches it, it still just runs away
    falseBtn.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); dodge(e.clientX, e.clientY); });

    // Also dodge when the pointer gets close, so it can't be cornered and clicked
    document.addEventListener("pointermove", (e) => {
      if (!quizActive) return;
      const r = falseBtn.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const nearX = Math.abs(e.clientX - cx) < r.width / 2 + 45;
      const nearY = Math.abs(e.clientY - cy) < r.height / 2 + 45;
      if (nearX && nearY) dodge(e.clientX, e.clientY);
    });

    window.addEventListener("resize", () => {
      if (falseBtn.classList.contains("flying")) dodge();
    });

    // ---------- Floating hearts ----------
    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = Math.random() > 0.5 ? "❤️" : "💗";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = Math.random() * 22 + 14 + "px";
      heart.style.animationDuration = Math.random() * 3 + 4 + "s";
      heart.style.opacity = Math.random() * 0.5 + 0.4;
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 8000);
    }
    setInterval(createHeart, 380);
  </script>

</body>
</html>
